name: Anyrouter Keepalive

on:
  schedule:
    # UTC 01:00 = runs 01:00-07:00 UTC, last round ~06:20 UTC
    # CEST 03:00-09:20 → warm until ~10:10 — covers the whole morning
    # CET  02:00-08:20 → warm until ~09:10 — covers the whole morning
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API Base URL'
        required: false
        default: 'https://anyrouter.top'
      model:
        description: 'Model id (claude-* -> Anthropic, others -> OpenAI Responses)'
        required: false
        default: 'gpt-6-astra'
      protocol:
        description: 'Protocol: auto | anthropic | responses | openai | codex'
        required: false
        default: 'auto'

      interval:
        description: 'Seconds between two requests, e.g. 30 (blank = built-in pacing: 30s between tokens, 50min/30min between rounds)'
        required: false
        default: ''

      install_cli:
        description: 'Install CLIs before running: auto (only what the protocol needs) | yes (Claude + Codex) | no (skip)'
        required: false
        default: 'auto'

      slow_interval_min:
        description: 'After the first healthy answer, keep alive every N minutes (only applies when interval is set; 0 = stay fast)'
        required: false
        default: '30'

      smtp_debug:
        description: 'Print the raw SMTP conversation when sending the report email (true/false)'
        required: false
        default: 'false'

# Prevent concurrent runs stacking up
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h max, our script self-terminates at ~5h58m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        if: ${{ (github.event.inputs.install_cli || 'auto') != 'no' && ((github.event.inputs.install_cli || 'auto') == 'yes' || (github.event.inputs.protocol || 'auto') == 'anthropic' || ((github.event.inputs.protocol || 'auto') == 'auto' && startsWith(github.event.inputs.model || 'gpt-6-astra', 'claude'))) }}
        run: bash scripts/install-cli.sh claude

      - name: Install Codex CLI
        if: ${{ (github.event.inputs.install_cli || 'auto') != 'no' && ((github.event.inputs.install_cli || 'auto') == 'yes' || (github.event.inputs.protocol || 'auto') == 'codex') }}
        run: bash scripts/install-cli.sh codex

      - name: Show available CLIs
        if: ${{ (github.event.inputs.install_cli || 'auto') != 'no' }}
        run: |
          command -v claude >/dev/null 2>&1 && claude --version || echo "claude CLI: not installed"
          command -v codex >/dev/null 2>&1 && codex --version || echo "codex CLI: not installed"

      - name: Run keepalive for all tokens
        env:
          ANYROUTER_TOKENS: ${{ secrets.ANYROUTER_TOKENS }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top' }}
          MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
          PROTOCOL: ${{ github.event.inputs.protocol || 'auto' }}
          REQUEST_INTERVAL_SEC: ${{ github.event.inputs.interval || '' }}
          SLOW_INTERVAL_MIN: ${{ github.event.inputs.slow_interval_min || '30' }}
          SMTP_DEBUG: ${{ github.event.inputs.smtp_debug || 'false' }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          CI: "true"
        run: bash scripts/run-all.sh
