name: Anyrouter Keepalive (Once)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API Base URL'
        required: false
        default: 'https://anyrouter.top'
      model:
        description: 'Model id (claude-* -> Anthropic, others -> OpenAI Responses)'
        required: false
        default: 'gpt-6-astra'
      protocol:
        description: 'Protocol: auto | anthropic | responses | openai'
        required: false
        default: 'auto'

      interval:
        description: 'Seconds between two requests, e.g. 30 (blank = built-in pacing: 30s between tokens, 50min/30min between rounds)'
        required: false
        default: ''

jobs:
  keepalive-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        if: ${{ (github.event.inputs.protocol || 'auto') == 'anthropic' || ((github.event.inputs.protocol || 'auto') == 'auto' && startsWith(github.event.inputs.model || 'gpt-6-astra', 'claude')) }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude CLI
        if: ${{ (github.event.inputs.protocol || 'auto') == 'anthropic' || ((github.event.inputs.protocol || 'auto') == 'auto' && startsWith(github.event.inputs.model || 'gpt-6-astra', 'claude')) }}
        run: claude --version

      - name: Run keepalive once for all tokens
        env:
          ANYROUTER_TOKENS: ${{ secrets.ANYROUTER_TOKENS }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top' }}
          MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
          PROTOCOL: ${{ github.event.inputs.protocol || 'auto' }}
          REQUEST_INTERVAL_SEC: ${{ github.event.inputs.interval || '' }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          CI: "true"
        run: bash scripts/run-all.sh --once
